name: Release Charts

on:
  workflow_dispatch:
    inputs: 
      skip_existing:
        description: 'Skip package upload if release/tag already exists'
        required: true
        default: true
  push:
    branches:
      - main
      - master

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Safe only while this repo is public: cr pushes with CR_TOKEN, but its
          # `git fetch --tags` and `git pull` here are anonymous reads.
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Keep in step with helm-ci.yaml, or releases package with a Helm CI never tested.
          version: v4.2.4

      - name: Add Helm repositories
        run: |
          helm repo add tika https://apache.jfrog.io/artifactory/tika
          helm repo add maikumori https://maikumori.github.io/helm-charts
          helm repo update

      # Released cr (<= v1.8.1) publishes before uploading, which immutable releases reject.
      # Built from the helm/chart-releaser#587 merge until a release ships it: watch
      # https://github.com/helm/chart-releaser/releases, then drop the Go and build steps and
      # install_dir below, and set the action's `version:` to that release.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # chart-releaser's go.mod at the pinned commit needs 1.26.
          go-version: "1.26"
          cache: false

      - name: Build chart-releaser
        env:
          GOBIN: ${{ runner.tool_cache }}/cr/30b66b7/x86_64
        run: |
          go version
          go install github.com/helm/chart-releaser/cr@30b66b7eb6f59dc22fea53436c20e1efa557cf29

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584 # v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          # An existing install_dir makes the action skip its own cr download.
          install_dir: ${{ runner.tool_cache }}/cr/30b66b7/x86_64
          # chart-releaser reads this as an action input, not an environment
          # variable. Under env: it was silently ignored, so cr tried to create
          # a release for every changed chart even when that tag already
          # existed, and the run failed on the first one.
          # Absent on push, a string on workflow_dispatch, so anything other
          # than an explicit "false" keeps the safe behaviour.
          skip_existing: ${{ github.event.inputs.skip_existing != 'false' }}
