name: Generate Helm documentation

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm-docs-pr.yaml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # helm-docs-github-action pushes with a bare `git push` and takes no token
          # input, so it needs the checkout's credentials: persist-credentials: false
          # breaks the push.
          persist-credentials: true
      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          git-push: true
