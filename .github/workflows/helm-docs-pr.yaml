name: Generate Helm documentation

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/scripts/check_helm_docs_render.sh"
      - ".github/workflows/helm-docs-pr.yaml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # helm-docs-github-action pushes with a bare `git push` and takes no token
          # input, so it needs the checkout's credentials: persist-credentials: false
          # breaks the push.
          persist-credentials: true
      - name: Install helm-docs
        # Installer only: puts the pinned helm-docs on PATH; no Chart.yaml under .github/workflows, so nothing renders.
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          chart-search-root: .github/workflows

      - name: Verify every chart renders
        # helm-docs exits 0 on a broken template but still commits a truncated README (HOMAAA-221).
        run: .github/scripts/check_helm_docs_render.sh .

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          git-push: true
