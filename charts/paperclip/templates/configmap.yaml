{{- include "paperclip.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "paperclip.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- range $key, $val := .Values.config.extraEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
