{{- if .Values.rbac.create }}
{{- $scope := .Values.rbac.scope }}
{{- $roleName := include "paperclip.fullname" . }}
{{- /*
Either bind an existing role, or define one from rules. The two are mutually
exclusive; _validate.tpl rejects setting both or neither.
*/ -}}
{{- if .Values.rbac.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if eq $scope "cluster" }}ClusterRole{{ else }}Role{{ end }}
metadata:
  name: {{ $roleName }}
  {{- if ne $scope "cluster" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
  {{- with .Values.rbac.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if eq $scope "cluster" }}ClusterRoleBinding{{ else }}RoleBinding{{ end }}
metadata:
  name: {{ $roleName }}
  {{- if ne $scope "cluster" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
  {{- with .Values.rbac.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.rbac.rules }}{{ if eq $scope "cluster" }}ClusterRole{{ else }}Role{{ end }}{{ else }}ClusterRole{{ end }}
  name: {{ if .Values.rbac.rules }}{{ $roleName }}{{ else }}{{ .Values.rbac.clusterRole }}{{ end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "paperclip.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
