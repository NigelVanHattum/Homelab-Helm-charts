{{- /*
Chart-managed Secret. Only rendered when something sensitive is supplied inline
rather than delegated to a secret you manage yourself.
*/ -}}
{{- $createAuth := and (not .Values.auth.betterAuthSecret.existingSecret) .Values.auth.betterAuthSecret.value -}}
{{- $createMaster := and (not .Values.secrets.masterKey.existingSecret) .Values.secrets.masterKey.value -}}
{{- $external := eq .Values.database.mode "external" -}}
{{- $componentMode := include "paperclip.externalDb.componentMode" . -}}
{{- $createDbUrl := and $external (not .Values.database.external.existingSecret) .Values.database.external.url -}}
{{- $createDbPassword := and $external $componentMode (not .Values.database.external.password.existingSecret) .Values.database.external.password.value -}}
{{- $createSecretEnv := gt (len .Values.secretEnv) 0 -}}
{{- if or $createAuth $createMaster $createDbUrl $createDbPassword $createSecretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperclip.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $createAuth }}
  BETTER_AUTH_SECRET: {{ .Values.auth.betterAuthSecret.value | quote }}
  {{- end }}
  {{- if $createMaster }}
  PAPERCLIP_SECRETS_MASTER_KEY: {{ .Values.secrets.masterKey.value | quote }}
  {{- end }}
  {{- if $createDbUrl }}
  database-url: {{ .Values.database.external.url | quote }}
  {{- end }}
  {{- if $createDbPassword }}
  database-password: {{ .Values.database.external.password.value | quote }}
  {{- end }}
  {{- range $key, $val := .Values.secretEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
