{{- if .Values.networkPolicy.enabled }}
{{- /*
Needs a CNI that enforces NetworkPolicy. Flannel, the Talos default, creates
the object and ignores it.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "paperclip.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "paperclip.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  ingress:
    {{- if .Values.networkPolicy.ingress.allowAll }}
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
    {{- with .Values.networkPolicy.ingress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress.dns }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.egress.https }}
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.networkPolicy.egress.database }}
    {{- if include "paperclip.cnpg.enabled" . }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "paperclip.cnpg.clusterName" . }}
      ports:
        - protocol: TCP
          port: 5432
    {{- else }}
    - ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
