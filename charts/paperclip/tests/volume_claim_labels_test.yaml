suite: volumeClaimTemplates carry no version label
release:
  name: paperclip
  namespace: paperclip
set:
  auth.betterAuthSecret.value: auth-secret
  secrets.masterKey.value: master-key
tests:
  # spec.volumeClaimTemplates is immutable (ValidateImmutableField), so any label that
  # changes with a chart or app version makes every bump an unsyncable diff.
  - it: puts only the selector labels on the data claim template
    templates:
      - templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.labels
          value:
            app.kubernetes.io/name: paperclip
            app.kubernetes.io/instance: paperclip

  - it: never puts helm.sh/chart, app version or managed-by on a claim template
    templates:
      - templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.labels["app.kubernetes.io/version"]
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.labels["app.kubernetes.io/managed-by"]

  - it: keeps the full label set on the StatefulSet itself
    templates:
      - templates/statefulset.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
