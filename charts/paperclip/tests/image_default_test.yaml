suite: image tag has no default
templates:
  - templates/configmap.yaml
release:
  name: paperclip
  namespace: paperclip
# No image.tag here on purpose: this suite renders the chart defaults, which every other suite pins.
set:
  auth.betterAuthSecret.value: auth-secret
  secrets.masterKey.value: master-key
tests:
  - it: fails on the chart defaults, so no values file can ship a floating tag
    asserts:
      - failedTemplate:
          errorPattern: "image.tag or image.digest is required"

  - it: renders once a values file sets a tag
    set:
      image.tag: "2026.1023.0"
    asserts:
      - notFailedTemplate: {}
