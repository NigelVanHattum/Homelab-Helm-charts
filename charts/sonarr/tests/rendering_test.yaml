suite: rendering behaviour
release:
  name: sonarr
  namespace: media
tests:
  - it: renders a StatefulSet named after the release
    templates:
      - templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: sonarr
      - equal:
          path: metadata.namespace
          value: media
      - equal:
          path: spec.replicas
          value: 1

  - it: pulls the linuxserver image and defaults the tag to latest
    templates:
      - templates/statefulset.yaml
    set:
      image.tag: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: lscr.io/linuxserver/sonarr:latest

  - it: honours an explicit image tag
    templates:
      - templates/statefulset.yaml
    set:
      image.tag: "1.2.3"
      image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: lscr.io/linuxserver/sonarr:1.2.3
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: passes sonarr.env through verbatim
    templates:
      - templates/statefulset.yaml
    set:
      sonarr.env:
        - name: PUID
          value: "1036"
        - name: POSTGRES_HOST
          value: pg.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            value: pg.example.com

  - it: mounts the config volume at /config
    templates:
      - templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: "/config"
            name: sonarr-config

  - it: claims the chart-managed config PVC by default
    templates:
      - templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sonarr-config
            persistentVolumeClaim:
              claimName: sonarr-config

  - it: points the config volume at an existing PVC when given one
    templates:
      - templates/statefulset.yaml
    set:
      sonarr.persistence.config.useExistingPvc: pv-sonarr-config
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sonarr-config
            persistentVolumeClaim:
              claimName: pv-sonarr-config

  - it: sizes the config claim template from values
    templates:
      - templates/statefulset.yaml
    set:
      sonarr.persistence.config.size: 5Gi
      sonarr.persistence.config.storageClassName: nfs-csi-applications
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: sonarr-config
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 5Gi
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: nfs-csi-applications

  - it: binds the claim to a named volume when asked
    templates:
      - templates/statefulset.yaml
    set:
      sonarr.persistence.config.existingVolume: pv-sonarr
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.volumeName
          value: pv-sonarr

  # The template emits the volumeClaimTemplates key unconditionally, so with
  # persistence off the StatefulSet carries `volumeClaimTemplates: null`.
  # Kubernetes accepts it; the assertion pins the behaviour so a later cleanup
  # is a deliberate change rather than a surprise.
  - it: falls back to emptyDir when config persistence is off
    templates:
      - templates/statefulset.yaml
    set:
      sonarr.persistence.config.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sonarr-config
            emptyDir: {}
      - isNullOrEmpty:
          path: spec.volumeClaimTemplates

  - it: mounts an extra volume and creates its claim template
    templates:
      - templates/statefulset.yaml
    set:
      sonarr.persistence.extraVolumes:
        - volumeName: media
          containerPath: /media
          size: 100Gi
          accessModes: ["ReadWriteMany"]
          storageClassName: nfs-csi-plex
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /media
            name: sonarr-media
      - equal:
          path: spec.volumeClaimTemplates[1].metadata.name
          value: sonarr-media
      - equal:
          path: spec.volumeClaimTemplates[1].spec.resources.requests.storage
          value: 100Gi

  - it: references an existing PVC for an extra volume instead of claiming one
    templates:
      - templates/statefulset.yaml
    set:
      sonarr.persistence.extraVolumes:
        - volumeName: media
          containerPath: /media
          useExistingPvc: pvc-p2p
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pvc-p2p
            persistentVolumeClaim:
              claimName: pvc-p2p
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 1

  - it: leaves the pod template free of the nondeterministic rollme annotation
    templates:
      - templates/statefulset.yaml
    asserts:
      - isNull:
          path: spec.template.metadata.annotations

  # rollme is randAlphaNum, so it changes on every render. With podAnnotations
  # set, a GitOps controller that re-renders the chart sees a fresh value every
  # refresh and reports the workload permanently OutOfSync.
  - it: stamps a random rollme once podAnnotations are set
    templates:
      - templates/statefulset.yaml
    set:
      podAnnotations:
        example.com/owner: homelab
    asserts:
      - exists:
          path: spec.template.metadata.annotations.rollme
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: homelab
