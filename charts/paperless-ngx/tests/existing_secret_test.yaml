suite: existing/external secret
release:
  name: paperless-ngx
  namespace: paperless-ngx
tests:
  # ---- default (inline) path: unchanged ownership ----
  - it: renders its own Secret when no existing one is named
    templates:
      - templates/secret.yaml
    set:
      paperless.env.PAPERLESS_ADMIN_PASSWORD: admin-pw
      paperless.env.PAPERLESS_SECRET_KEY: django-key
      paperless.database.password: db-pw
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: paperless-ngx
      - equal:
          path: data["admin-password"]
          value: admin-pw
          decodeBase64: true
      - equal:
          path: data["secret-key"]
          value: django-key
          decodeBase64: true
      - equal:
          path: data["db-password"]
          value: db-pw
          decodeBase64: true

  # ---- external path ----
  - it: renders no Secret of its own when pointed at an existing one
    templates:
      - templates/secret.yaml
    set:
      paperless.existingSecret: paperless-ngx-credentials
    asserts:
      - hasDocuments:
          count: 0

  - it: reads every sensitive env var from the existing Secret
    templates:
      - templates/statefulset.yaml
    set:
      paperless.existingSecret: paperless-ngx-credentials
      paperless.database.host: postgresql-cluster-rw.postgresql.svc.cluster.local
      paperless.authentik.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-credentials
                key: admin-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-credentials
                key: secret-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_DBPASS
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-credentials
                key: db-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-credentials
                key: socialaccount-providers

  - it: honours per-value key overrides
    templates:
      - templates/statefulset.yaml
    set:
      paperless.existingSecret: paperless-ngx-credentials
      paperless.existingSecretKeys:
        adminPassword: ADMIN_PASSWORD
        secretKey: SECRET_KEY
        dbPassword: POSTGRES_PASSWORD
        socialaccountProviders: OIDC_PROVIDERS
      paperless.database.host: postgresql-cluster-rw.postgresql.svc.cluster.local
      paperless.authentik.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-credentials
                key: ADMIN_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-credentials
                key: SECRET_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_DBPASS
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-credentials
                key: POSTGRES_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-credentials
                key: OIDC_PROVIDERS

  # A partial override leaves the rest on the chart's own key names, so a Secret
  # that only renames one field does not have to restate the others.
  - it: falls back to the default key name for values not overridden
    templates:
      - templates/statefulset.yaml
    set:
      paperless.existingSecret: paperless-ngx-credentials
      paperless.existingSecretKeys:
        dbPassword: POSTGRES_PASSWORD
      paperless.database.host: postgresql-cluster-rw.postgresql.svc.cluster.local
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-credentials
                key: admin-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_DBPASS
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-credentials
                key: POSTGRES_PASSWORD

  # existingSecretKeys only ever describes somebody else's Secret. The one the
  # chart renders keeps its documented key names, so overriding them on the
  # inline path cannot desynchronise the Secret from the StatefulSet.
  - it: ignores key overrides on the inline path
    templates:
      - templates/statefulset.yaml
    set:
      paperless.existingSecretKeys:
        adminPassword: ADMIN_PASSWORD
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: paperless-ngx
                key: admin-password

  # The bundled PostgreSQL subchart owns its own Secret either way.
  - it: still reads the bundled database password from the subchart Secret
    templates:
      - templates/statefulset.yaml
    set:
      paperless.existingSecret: paperless-ngx-credentials
      paperless.database.enabled: true
      paperless.database.host: paperless-ngx-postgresql
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_DBPASS
            valueFrom:
              secretKeyRef:
                name: paperless-ngx-postgresql
                key: password

  # Usernames were left in values on purpose: they are not secret, and moving
  # them would churn every consumer for nothing.
  - it: keeps the usernames as plain env values
    templates:
      - templates/statefulset.yaml
    set:
      paperless.existingSecret: paperless-ngx-credentials
      paperless.database.host: postgresql-cluster-rw.postgresql.svc.cluster.local
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_ADMIN_USER
            value: admin
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PAPERLESS_DBUSER
            value: paperless
