{{- include "homebox.validate" . }}
{{- $data := .Values.homebox.persistence.data }}
{{- $db := .Values.homebox.database }}
{{- $hasSecret := or .Values.homebox.existingSecret false }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "homebox.fullname" . }}
  labels:
    {{- include "homebox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "homebox.fullname" . }}
{{- if and $data.enabled (not $data.useExistingPvc) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- /* selectorLabels only: volumeClaimTemplates is immutable, a version label breaks every bump. */}}
        labels:
          {{- include "homebox.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $data.size }}
        {{- with $data.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with $data.existingVolume }}
        volumeName: {{ . }}
        {{- end }}
        {{- if or $data.matchLabels $data.matchExpressions }}
        selector:
          {{- with $data.matchLabels }}
          matchLabels:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $data.matchExpressions }}
          matchExpressions:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
{{- end }}
  selector:
    matchLabels:
      {{- include "homebox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "homebox.labels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "homebox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HBOX_AUTH_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "homebox.secretName" . }}
                  key: {{ include "homebox.secretKey" (dict "root" . "key" "apiKeyPepper") }}
            - name: HBOX_DATABASE_DRIVER
              value: {{ $db.driver | quote }}
{{- if eq $db.driver "postgres" }}
            - name: HBOX_DATABASE_HOST
              value: {{ $db.host | quote }}
            - name: HBOX_DATABASE_PORT
              value: {{ $db.port | quote }}
            - name: HBOX_DATABASE_USERNAME
              value: {{ $db.username | quote }}
            - name: HBOX_DATABASE_DATABASE
              value: {{ $db.database | quote }}
            - name: HBOX_DATABASE_SSL_MODE
              value: {{ $db.sslMode | quote }}
{{- if or $hasSecret $db.password }}
            - name: HBOX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "homebox.secretName" . }}
                  key: {{ include "homebox.secretKey" (dict "root" . "key" "databasePassword") }}
{{- end }}
{{- end }}
{{- if or $hasSecret .Values.homebox.oidc.clientSecret }}
            - name: HBOX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homebox.secretName" . }}
                  key: {{ include "homebox.secretKey" (dict "root" . "key" "oidcClientSecret") }}
                  optional: true
{{- end }}
{{- if or $hasSecret .Values.homebox.mailer.password }}
            - name: HBOX_MAILER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "homebox.secretName" . }}
                  key: {{ include "homebox.secretKey" (dict "root" . "key" "mailerPassword") }}
                  optional: true
{{- end }}
{{- range $name, $value := .Values.homebox.config }}
            - name: {{ $name }}
              value: {{ $value | quote }}
{{- end }}
{{- with .Values.homebox.extraEnv }}
            {{- toYaml . | nindent 12 }}
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.homebox.config.HBOX_WEB_PORT | default 7745 }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
{{- if $data.enabled }}
            - name: data
              mountPath: /data
{{- end }}
            - name: tmp
              mountPath: /tmp
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- if and $data.enabled $data.useExistingPvc }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $data.useExistingPvc }}
{{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
