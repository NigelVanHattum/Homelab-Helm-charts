{{- if not .Values.homebox.existingSecret }}
{{- include "homebox.validate" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "homebox.fullname" . }}
  labels:
    {{- include "homebox.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key-pepper: {{ .Values.homebox.auth.apiKeyPepper | quote }}
{{- if and (eq .Values.homebox.database.driver "postgres") .Values.homebox.database.password }}
  database-password: {{ .Values.homebox.database.password | quote }}
{{- end }}
{{- with .Values.homebox.storage.s3.accessKeyId }}
  s3-access-key-id: {{ . | quote }}
{{- end }}
{{- with .Values.homebox.storage.s3.secretAccessKey }}
  s3-secret-access-key: {{ . | quote }}
{{- end }}
{{- with .Values.homebox.oidc.clientSecret }}
  oidc-client-secret: {{ . | quote }}
{{- end }}
{{- with .Values.homebox.mailer.password }}
  mailer-password: {{ . | quote }}
{{- end }}
{{- end }}
