apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "homebox.fullname" . }}-test-connection"
  labels:
    {{- include "homebox.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-q', '-O', '-', '{{ include "homebox.fullname" . }}:{{ .Values.service.port }}/api/v1/status']
  restartPolicy: Never
