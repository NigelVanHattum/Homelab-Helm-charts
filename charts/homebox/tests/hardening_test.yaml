suite: pod hardening
release:
  name: homebox
  namespace: homebox
set:
  homebox.auth.apiKeyPepper: "placeholder-pepper-for-unit-tests-0000"
tests:
  - it: StatefulSet pod mounts no ServiceAccount token
    templates:
      - templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: Deployment pod mounts no ServiceAccount token
    templates:
      - templates/deployment.yaml
    set:
      type: Deployment
      homebox.persistence.data.enabled: false
      homebox.database.driver: postgres
      homebox.database.host: homebox-rw.cnpg.svc.cluster.local
      homebox.database.password: pg-password
      homebox.storage.s3.accessKeyId: rustfs-key
      homebox.storage.s3.secretAccessKey: rustfs-secret
      homebox.config.HBOX_STORAGE_CONN_STRING: s3://homebox?endpoint=http://10.0.0.1:9000&disable_https=true&use_path_style=true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: test hook pins busybox and mounts no ServiceAccount token
    templates:
      - templates/tests/test-connection.yaml
    asserts:
      - equal:
          path: spec.containers[0].image
          value: busybox:1.37.0
      - equal:
          path: spec.automountServiceAccountToken
          value: false
