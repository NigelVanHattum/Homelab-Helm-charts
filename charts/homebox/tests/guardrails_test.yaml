suite: guardrails that refuse to render a broken release
release:
  name: homebox
  namespace: homebox
templates:
  - templates/statefulset.yaml
tests:
  # Homebox exits on a pepper shorter than 32 bytes, so the chart stops at render time
  # instead of shipping a CrashLoopBackOff.
  - it: fails without a pepper and without an existing secret
    asserts:
      - failedTemplate:
          errorMessage: "homebox.auth.apiKeyPepper is required: set it (at least 32 bytes, `openssl rand -base64 48`) or point homebox.existingSecret at a Secret holding it"

  - it: fails on a pepper shorter than 32 bytes
    set:
      homebox.auth.apiKeyPepper: too-short
    asserts:
      - failedTemplate:
          errorMessage: "homebox.auth.apiKeyPepper must be at least 32 bytes, got 9: Homebox refuses to start on a shorter one"

  - it: accepts an existing secret in place of an inline pepper
    set:
      homebox.existingSecret: homebox-credentials
    asserts:
      - isKind:
          of: StatefulSet

  - it: fails on postgres without a host
    set:
      homebox.auth.apiKeyPepper: placeholder-pepper-for-unit-tests-0000
      homebox.database.driver: postgres
    asserts:
      - failedTemplate:
          errorMessage: "homebox.database.driver=postgres needs homebox.database.host"

  - it: fails on an unsupported driver
    set:
      homebox.auth.apiKeyPepper: placeholder-pepper-for-unit-tests-0000
      homebox.database.driver: mysql
    asserts:
      - failedTemplate:
          errorMessage: 'homebox.database.driver must be sqlite3 or postgres, got "mysql"'

  - it: fails on an unknown workload kind
    set:
      homebox.auth.apiKeyPepper: placeholder-pepper-for-unit-tests-0000
      type: DaemonSet
    asserts:
      - failedTemplate:
          errorMessage: 'type must be Deployment or StatefulSet, got "DaemonSet"'

  # A Deployment has no volumeClaimTemplates, so persistence there is an existing PVC or nothing.
  - it: fails on a Deployment that would need a claim of its own
    set:
      homebox.auth.apiKeyPepper: placeholder-pepper-for-unit-tests-0000
      type: Deployment
    asserts:
      - failedTemplate:
          errorMessage: "type=Deployment cannot claim a volume: set homebox.persistence.data.useExistingPvc, or disable homebox.persistence.data.enabled (postgres plus S3 storage)"

  - it: fails on an s3 connection string without credentials
    set:
      homebox.auth.apiKeyPepper: placeholder-pepper-for-unit-tests-0000
      homebox.config.HBOX_STORAGE_CONN_STRING: s3://homebox?use_path_style=true
    asserts:
      - failedTemplate:
          errorMessage: "an s3:// HBOX_STORAGE_CONN_STRING needs homebox.storage.s3.accessKeyId and secretAccessKey, or homebox.existingSecret carrying them"

  # A plain value in homebox.config lands in the workload spec, which ClusterRole view reads.
  - it: refuses a secret-bearing key in the plain config map
    set:
      homebox.auth.apiKeyPepper: placeholder-pepper-for-unit-tests-0000
      homebox.config.AWS_SECRET_ACCESS_KEY: leaked-into-the-pod-spec
    asserts:
      - failedTemplate:
          errorMessage: "homebox.config.AWS_SECRET_ACCESS_KEY is a secret the chart reads through secretKeyRef: a plain value there lands in the workload spec; use the homebox.* value or homebox.existingSecret"
