suite: the chart secret and the external one
release:
  name: homebox
  namespace: homebox
tests:
  - it: writes only the keys the release uses
    templates:
      - templates/secret.yaml
    set:
      homebox.auth.apiKeyPepper: placeholder-pepper-for-unit-tests-0000
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData
          value:
            api-key-pepper: placeholder-pepper-for-unit-tests-0000

  - it: adds the postgres, OIDC and mailer keys when those are set
    templates:
      - templates/secret.yaml
    set:
      homebox.auth.apiKeyPepper: placeholder-pepper-for-unit-tests-0000
      homebox.database.driver: postgres
      homebox.database.host: postgres-rw
      homebox.database.password: pg-password
      homebox.oidc.clientSecret: oidc-secret
      homebox.mailer.password: mailer-secret
    asserts:
      - equal:
          path: stringData
          value:
            api-key-pepper: placeholder-pepper-for-unit-tests-0000
            database-password: pg-password
            oidc-client-secret: oidc-secret
            mailer-password: mailer-secret

  - it: renders no secret of its own when pointed at an external one
    templates:
      - templates/secret.yaml
    set:
      homebox.existingSecret: homebox-credentials
      homebox.auth.apiKeyPepper: placeholder-pepper-for-unit-tests-0000
    asserts:
      - hasDocuments:
          count: 0

  - it: reads every sensitive value from the external secret, under its own key names
    templates:
      - templates/statefulset.yaml
    set:
      homebox.existingSecret: homebox-credentials
      homebox.existingSecretKeys:
        apiKeyPepper: pepper
        databasePassword: pgpass
        oidcClientSecret: oidc
        mailerPassword: smtp
      homebox.database.driver: postgres
      homebox.database.host: postgres-rw
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HBOX_AUTH_API_KEY_PEPPER
            valueFrom:
              secretKeyRef:
                name: homebox-credentials
                key: pepper
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HBOX_DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: homebox-credentials
                key: pgpass
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HBOX_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: homebox-credentials
                key: oidc
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HBOX_MAILER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: homebox-credentials
                key: smtp
                optional: true

  - it: falls back to the default key names for an external secret
    templates:
      - templates/statefulset.yaml
    set:
      homebox.existingSecret: homebox-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HBOX_AUTH_API_KEY_PEPPER
            valueFrom:
              secretKeyRef:
                name: homebox-credentials
                key: api-key-pepper
