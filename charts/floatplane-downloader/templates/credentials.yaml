{{- if not .Values.floatplane.credentials.useExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: floatplane-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "floatplane-downloader.labels" . | nindent 4 }}
data:
  {{- /* quote wraps the base64 output, never the credential: quoting the value before b64enc
         would store the " characters as part of the credential itself. */}}
  username: {{b64enc (required "Please provide the floatplane username" .Values.floatplane.credentials.username | trim) | quote}}
  password: {{b64enc (required "Please provide the floatplane password" .Values.floatplane.credentials.password | trim) | quote}}
  mfa: {{b64enc (.Values.floatplane.credentials.mfa | trim) | quote}}
  plex-token: {{b64enc (.Values.floatplane.credentials.plexToken | trim) | quote}}
{{- end }}