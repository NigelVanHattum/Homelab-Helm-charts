suite: rendering behaviour
release:
  name: floatplane
  namespace: floatplane
tests:
  - it: renders a StatefulSet with the downloader image
    templates:
      - templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].image
          value: inrix/floatplane-downloader:latest

  - it: honours an explicit image tag
    templates:
      - templates/statefulset.yaml
    set:
      image.tag: "4.1.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: inrix/floatplane-downloader:4.1.0

  - it: runs headless and reads the plex token from the secret
    templates:
      - templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: headless
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: plex_token
            valueFrom:
              secretKeyRef:
                name: floatplane-credentials
                key: plex-token

  - it: no longer passes username, password or mfa to the container
    templates:
      - templates/statefulset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: username
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: password
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: token
          any: true

  - it: reads the plex token from an existing secret when given one
    templates:
      - templates/statefulset.yaml
    set:
      floatplane.credentials.useExistingSecret: onepassword-floatplane
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: plex_token
            valueFrom:
              secretKeyRef:
                name: onepassword-floatplane
                key: plex-token
