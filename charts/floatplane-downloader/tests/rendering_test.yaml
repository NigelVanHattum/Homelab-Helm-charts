suite: rendering behaviour
release:
  name: floatplane
  namespace: floatplane
# image.tag has no default and fails the render when empty (image_default_test.yaml covers that).
set:
  image.tag: "dev@sha256:738022a706847e11083058fe228b36bdeb9a28dc4a573b7a36143621abf971a0"
tests:
  - it: renders a StatefulSet with the downloader image
    templates:
      - templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].image
          value: inrix/floatplane-downloader:dev@sha256:738022a706847e11083058fe228b36bdeb9a28dc4a573b7a36143621abf971a0

  - it: honours an explicit image tag
    templates:
      - templates/statefulset.yaml
    set:
      image.tag: "4.1.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: inrix/floatplane-downloader:4.1.0

  - it: runs headless and reads the plex token from the secret
    templates:
      - templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: headless
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: plex_token
            valueFrom:
              secretKeyRef:
                name: floatplane-credentials
                key: plex-token

  - it: no longer passes username, password or mfa to the container
    templates:
      - templates/statefulset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: username
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: password
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: token
          any: true

  - it: reads the plex token from an existing secret when given one
    templates:
      - templates/statefulset.yaml
    set:
      floatplane.credentials.useExistingSecret: onepassword-floatplane
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: plex_token
            valueFrom:
              secretKeyRef:
                name: onepassword-floatplane
                key: plex-token
