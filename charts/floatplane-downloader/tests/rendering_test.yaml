suite: rendering behaviour
release:
  name: floatplane
  namespace: floatplane
set:
  floatplane.credentials.username: ci-user
  floatplane.credentials.password: ci-password
tests:
  - it: renders a StatefulSet with the downloader image
    templates:
      - templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].image
          value: inrix/floatplane-downloader:latest

  - it: honours an explicit image tag
    templates:
      - templates/statefulset.yaml
    set:
      image.tag: "4.1.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: inrix/floatplane-downloader:4.1.0

  - it: runs headless and never inlines a credential
    templates:
      - templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: headless
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: username
            valueFrom:
              secretKeyRef:
                name: floatplane-credentials
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: password
            valueFrom:
              secretKeyRef:
                name: floatplane-credentials
                key: password

  - it: reads every credential from an existing secret when given one
    templates:
      - templates/statefulset.yaml
    set:
      floatplane.credentials.useExistingSecret: onepassword-floatplane
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: username
            valueFrom:
              secretKeyRef:
                name: onepassword-floatplane
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: plex_token
            valueFrom:
              secretKeyRef:
                name: onepassword-floatplane
                key: plex-token
