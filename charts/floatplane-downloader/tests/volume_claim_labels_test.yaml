suite: volumeClaimTemplates carry no version label
release:
  name: floatplane
  namespace: floatplane
# image.tag has no default and fails the render when empty (image_default_test.yaml covers that).
set:
  image.tag: "dev@sha256:738022a706847e11083058fe228b36bdeb9a28dc4a573b7a36143621abf971a0"
tests:
  # spec.volumeClaimTemplates is immutable (ValidateImmutableField), so any label that
  # changes with a chart or app version makes every bump an unsyncable diff. These claim
  # templates carry no labels at all today; adding one is what this suite forbids.
  - it: never puts helm.sh/chart, app version or managed-by on a claim template
    templates:
      - templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.labels["app.kubernetes.io/version"]
      - notExists:
          path: spec.volumeClaimTemplates[0].metadata.labels["app.kubernetes.io/managed-by"]
      - notExists:
          path: spec.volumeClaimTemplates[1].metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.volumeClaimTemplates[1].metadata.labels["app.kubernetes.io/version"]
      - notExists:
          path: spec.volumeClaimTemplates[1].metadata.labels["app.kubernetes.io/managed-by"]

  - it: keeps the full label set on the StatefulSet itself
    templates:
      - templates/statefulset.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["app.kubernetes.io/version"]
      - exists:
          path: metadata.labels["app.kubernetes.io/managed-by"]
