suite: credentials secret
templates:
  - templates/credentials.yaml
release:
  name: floatplane
  namespace: floatplane
tests:
  - it: fails without a username
    set:
      floatplane.credentials.password: ci-password
    asserts:
      - failedTemplate:
          errorPattern: "Please provide the floatplane username"

  - it: fails without a password
    set:
      floatplane.credentials.username: ci-user
    asserts:
      - failedTemplate:
          errorPattern: "Please provide the floatplane password"

  - it: base64-encodes the inline credentials
    set:
      floatplane.credentials.username: ci-user
      floatplane.credentials.password: ci-password
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: floatplane-credentials
      - equal:
          path: data.username
          value: Y2ktdXNlcg==
      - equal:
          path: data.password
          value: Y2ktcGFzc3dvcmQ=
      # plexToken defaults to "", so the key is present and empty — not the literal `""`
      # that the pre-0.4.0 `quote` produced (IiI=).
      - equal:
          path: data.plex-token
          value: ""

  - it: creates no secret when an existing one is referenced
    set:
      floatplane.credentials.useExistingSecret: onepassword-floatplane
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps leading zeros in the mfa token
    set:
      floatplane.credentials.username: ci-user
      floatplane.credentials.password: ci-password
      floatplane.credentials.mfa: "012345"
    asserts:
      # MDEyMzQ1, i.e. 012345 — not IjAxMjM0NSI=, which is "012345" with the quotes stored.
      - equal:
          path: data.mfa
          value: MDEyMzQ1
      - equal:
          path: data.mfa
          value: "012345"
          decodeBase64: true

  - it: stores the mfa token and plex token without surrounding quotes
    set:
      floatplane.credentials.username: ci-user
      floatplane.credentials.password: ci-password
      floatplane.credentials.plexToken: plex-token-value
    asserts:
      - equal:
          path: data.mfa
          value: "000000"
          decodeBase64: true
      - equal:
          path: data.plex-token
          value: plex-token-value
          decodeBase64: true
      # The decoded credential carries no quote character at all. Asserting on the raw base64
      # instead would need `^I[g-v]`: b64 of a leading `"` is always `I` plus one of g..v.
      - notMatchRegex:
          path: data.mfa
          pattern: '"'
          decodeBase64: true
      - notMatchRegex:
          path: data.plex-token
          pattern: '"'
          decodeBase64: true

  - it: rejects an unquoted numeric mfa token
    set:
      floatplane.credentials.username: ci-user
      floatplane.credentials.password: ci-password
      floatplane.credentials.mfa: 12345
    asserts:
      - failedTemplate:
          errorPattern: "got number, want string"

  - it: rejects an unquoted numeric plex token
    set:
      floatplane.credentials.username: ci-user
      floatplane.credentials.password: ci-password
      floatplane.credentials.plexToken: 12345
    asserts:
      - failedTemplate:
          errorPattern: "got number, want string"
