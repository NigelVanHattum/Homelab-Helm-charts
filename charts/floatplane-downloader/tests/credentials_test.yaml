suite: credentials secret
templates:
  - templates/credentials.yaml
release:
  name: floatplane
  namespace: floatplane
tests:
  - it: renders without any credentials
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: floatplane-credentials

  - it: no longer carries username, password or mfa
    asserts:
      - notExists:
          path: data.username
      - notExists:
          path: data.password
      - notExists:
          path: data.mfa

  - it: base64-encodes the plex token
    set:
      floatplane.credentials.plexToken: plex
    asserts:
      - equal:
          path: data["plex-token"]
          value: cGxleA==

  - it: leaves the plex token empty by default
    asserts:
      - equal:
          path: data["plex-token"]
          value: ""

  - it: creates no secret when an existing one is referenced
    set:
      floatplane.credentials.useExistingSecret: onepassword-floatplane
    asserts:
      - hasDocuments:
          count: 0
