suite: pod hardening
release:
  name: floatplane
  namespace: floatplane
# image.tag has no default and fails the render when empty (image_default_test.yaml covers that).
set:
  image.tag: "dev@sha256:738022a706847e11083058fe228b36bdeb9a28dc4a573b7a36143621abf971a0"
tests:
  - it: StatefulSet pod mounts no ServiceAccount token
    templates:
      - templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
