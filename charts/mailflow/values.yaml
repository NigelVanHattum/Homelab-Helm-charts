# Default values for mailflow.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  # -- Tag for both MailFlow images. Upstream releases backend and frontend together, so one
  # value moves both. Defaults to the chart `appVersion`.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# -- Annotations added to all three pods.
podAnnotations: {}
# -- Labels added to all three pods.
podLabels: {}

nodeSelector: {}

tolerations: []

affinity: {}

# -- `IMAGE_CACHE_DIR` and the `emptyDir` the backend mounts there, from one value so the
# variable and the mount path cannot drift apart. Keep `IMAGE_CACHE_MAX_MB` (512 by default
# in the application) below `imageCache.sizeLimit`, or the kubelet evicts the pod before
# MailFlow prunes the cache itself.
imageCache:
  path: /var/cache/mailflow/images
  sizeLimit: 1Gi

backend:
  image:
    repository: ghcr.io/maathimself/mailflow-backend
  service:
    type: ClusterIP
    # -- One port for the container's `PORT`, the Service and the frontend's `BACKEND_PORT`,
    # so the three cannot drift apart.
    port: 3000
  # -- Upstream waits up to 25 s for a send in flight to finish; compose gives it a 30 s
  # `stop_grace_period`.
  terminationGracePeriodSeconds: 30
  # -- `REDIS_URL`. Empty points at the Redis this chart deploys; required when
  # `redis.enabled` is `false`.
  redisUrl: ""
  # -- Environment appended verbatim, the raw list `03_applications` wires: `DB_HOST`,
  # `DB_PORT`, `DB_NAME`, `DB_USER`, `DB_PASSWORD`, `SESSION_SECRET`, `ENCRYPTION_KEY`,
  # `APP_URL`, `FRONTEND_URL`, `FIRST_USER_REGISTRATION`, `TRUST_PROXY_HOPS`, `VAPID_*`,
  # `IMAP_MAX_PERSISTENT_PER_HOST`, `IMAGE_CACHE_MAX_MB`, `MS_*`, `GOOGLE_*`. A sensitive one
  # belongs here as a `valueFrom`; a plain value for one fails to render. `NODE_ENV`, `PORT`,
  # `REDIS_URL` and `IMAGE_CACHE_DIR` are the chart's and are rejected here too.
  env: []
  # - name: DB_HOST
  #   value: mailflow-rw.cnpg.svc.cluster.local
  # - name: DB_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: mailflow-database
  #       key: password
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources: {}
    # limits:
    #   cpu: 1
    #   memory: 1Gi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
  readinessProbe:
    httpGet:
      path: /api/health
      port: http

frontend:
  image:
    repository: ghcr.io/maathimself/mailflow-frontend
  service:
    type: ClusterIP
    port: 80
  # -- `BACKEND_HOST`. Empty uses this release's backend Service. Never leave it at the
  # image's compose default (`backend`), which resolves to nothing here (upstream #436).
  backendHost: ""
  # -- `NGINX_TLS`, which the 4.3.x nginx frontend reads. `off` comments out the HTTPS server
  # and serves plain HTTP on port 80, for a TLS-terminating ingress; it then needs no
  # certificate.
  nginxTls: "off"
  # -- `TLS_MODE`, which the post-4.4 Caddy frontend reads while still honouring `NGINX_TLS`.
  # Inert at this `appVersion`; set so the 4.4 bump stays a tag change.
  tlsMode: "off"
  # -- Environment appended verbatim. `NGINX_TLS`, `TLS_MODE`, `BACKEND_HOST` and
  # `BACKEND_PORT` are the chart's and are rejected here.
  env: []
  podSecurityContext: {}
  # -- No `readOnlyRootFilesystem`: the entrypoint rewrites `/etc/nginx/conf.d/default.conf`
  # at boot for `NGINX_TLS`, for the backend upstream and for the cluster DNS resolver, and a
  # failed rewrite leaves HTTPS on with no certificate and `/api/` pointed at nothing.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources: {}
  # -- `GET /` on port 80, not the image's own `/healthz`: 4.3.x has no such location, and the
  # listener the later Caddy frontend puts it on binds `127.0.0.1:2080`, which no kubelet
  # reaches.
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

redis:
  # -- Sessions and cache only. `false` needs `backend.redisUrl` pointed at a Redis of your
  # own.
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  # -- compose's `redis-server --save 60 1 --loglevel warning`.
  args:
    - --save
    - "60"
    - "1"
    - --loglevel
    - warning
  # -- `emptyDir` at `/data`, never a PVC: nothing here survives the pod on purpose.
  dataSizeLimit: 1Gi
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources: {}
  livenessProbe:
    exec:
      command:
        - redis-cli
        - ping
  readinessProbe:
    exec:
      command:
        - redis-cli
        - ping

# -- Routes to the frontend Service. Multi-host: MailFlow is reached on every host listed.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local
