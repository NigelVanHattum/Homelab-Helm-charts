{{- include "mailflow.validate" . }}
{{- $component := "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailflow.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "mailflow.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mailflow.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mailflow.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          {{- /* No readOnlyRootFilesystem: the entrypoint rewrites /etc/nginx/conf.d/default.conf at boot. */}}
          {{- with .Values.frontend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "mailflow.frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- with .Values.frontend.nginxTls }}
            - name: NGINX_TLS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.frontend.tlsMode }}
            - name: TLS_MODE
              value: {{ . | quote }}
            {{- end }}
            - name: BACKEND_HOST
              value: {{ include "mailflow.backendHost" . | quote }}
            - name: BACKEND_PORT
              value: {{ .Values.backend.service.port | quote }}
            {{- with .Values.frontend.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          {{- with .Values.frontend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
