{{- include "mailflow.validate" . }}
{{- if .Values.redis.enabled }}
{{- $component := "redis" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailflow.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "mailflow.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  {{- /* Hardcoded: one Redis, and Recreate so two of them never answer the same Service. */}}
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mailflow.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mailflow.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          {{- with .Values.redis.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}{{ with .Values.redis.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          {{- if or .Values.redis.args (include "mailflow.redisAuth" .) }}
          args:
            {{- with .Values.redis.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if include "mailflow.redisAuth" . }}
            - --requirepass
            {{- /* Expanded by the kubelet from the env var below, so the password is never a literal here. */}}
            - $(REDIS_PASSWORD)
            {{- end }}
          {{- end }}
          {{- if include "mailflow.redisAuth" . }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret }}
                  key: {{ include "mailflow.redisSecretKey" . }}
            {{- /* redis-cli reads this, so the probes do not come back NOAUTH. */}}
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret }}
                  key: {{ include "mailflow.redisSecretKey" . }}
          {{- end }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.port }}
              protocol: TCP
          {{- with .Values.redis.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.redis.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.redis.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        {{- /* Sessions and cache only: an emptyDir, never a PVC. */}}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.redis.dataSizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
