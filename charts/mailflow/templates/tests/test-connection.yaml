apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mailflow.fullname" . }}-test-connection"
  labels:
    {{- include "mailflow.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox:1.37.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      command: ['wget']
      args: ['-q', '-O', '-', '{{ include "mailflow.componentName" (dict "root" . "component" "backend") }}:{{ .Values.backend.service.port }}/api/health']
  restartPolicy: Never
