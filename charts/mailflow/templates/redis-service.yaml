{{- if .Values.redis.enabled }}
{{- $component := "redis" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailflow.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "mailflow.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: {{ .Values.redis.service.type }}
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "mailflow.componentSelectorLabels" (dict "root" . "component" $component) | nindent 4 }}
{{- end }}
