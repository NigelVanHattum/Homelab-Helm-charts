# CI values: the paths a real 4.4.0 release uses - no Redis, the raw backend env list with a
# secretKeyRef, and a multi-host traefik ingress. Only Secret names here, never a credential.
backend:
  env:
    - name: DB_HOST
      value: mailflow-rw.cnpg.svc.cluster.local
    - name: DB_NAME
      value: mailflow
    - name: DB_USER
      value: mailflow
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ci-mailflow-database
          key: password
    - name: APP_URL
      value: https://mailflow.chart-example.local
    # Admins come from single sign-on here, so the first account to register is an ordinary one
    # and registration starts closed.
    - name: FIRST_USER_REGISTRATION
      value: "false"
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: mailflow.chart-example.local
      paths:
        - path: /
          pathType: Prefix
    - host: mail.chart-example.local
      paths:
        - path: /
          pathType: Prefix
