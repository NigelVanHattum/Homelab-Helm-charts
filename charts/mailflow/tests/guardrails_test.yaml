suite: guardrails that refuse to render a broken release
release:
  name: mailflow
  namespace: mailflow
templates:
  - templates/backend.yaml
tests:
  # A duplicate name in the raw env list leaves which value wins up to the kubelet.
  - it: refuses a backend variable the chart derives
    set:
      backend.env:
        - name: REDIS_URL
          value: redis://somewhere:6379
    asserts:
      - failedTemplate:
          errorMessage: "backend.env sets REDIS_URL, which this chart derives: use backend.redisUrl"

  - it: refuses IMAGE_CACHE_DIR, which has to match the mount
    set:
      backend.env:
        - name: IMAGE_CACHE_DIR
          value: /somewhere-else
    asserts:
      - failedTemplate:
          errorMessage: "backend.env sets IMAGE_CACHE_DIR, which this chart derives: use imageCache.path"

  - it: refuses PORT, which has to match the Service
    set:
      backend.env:
        - name: PORT
          value: "9999"
    asserts:
      - failedTemplate:
          errorMessage: "backend.env sets PORT, which this chart derives: use backend.service.port"

  # Asserted on the backend template like the rest: the guard runs before any of the three
  # workloads render, so the failure is not attributed to the frontend one.
  - it: refuses a frontend variable the chart derives
    set:
      frontend.env:
        - name: BACKEND_HOST
          value: backend
    asserts:
      - failedTemplate:
          errorMessage: "frontend.env sets BACKEND_HOST, which this chart derives: use frontend.backendHost"

  # Terraform owns the kubernetes_secret_v1; a plain value here lands in the workload spec,
  # which ClusterRole view reads.
  - it: refuses a plain SESSION_SECRET
    set:
      backend.env:
        - name: SESSION_SECRET
          value: hunter2
    asserts:
      - failedTemplate:
          errorMessage: "backend.env sets SESSION_SECRET as a plain value, which lands in the workload spec: use valueFrom.secretKeyRef, pointing at a Secret Terraform owns"

  - it: refuses a plain DB_PASSWORD
    set:
      backend.env:
        - name: DB_PASSWORD
          value: hunter2
    asserts:
      - failedTemplate:
          errorMessage: "backend.env sets DB_PASSWORD as a plain value, which lands in the workload spec: use valueFrom.secretKeyRef, pointing at a Secret Terraform owns"

  - it: refuses a plain ENCRYPTION_KEY
    set:
      backend.env:
        - name: ENCRYPTION_KEY
          value: 0123456789abcdef
    asserts:
      - failedTemplate:
          errorMessage: "backend.env sets ENCRYPTION_KEY as a plain value, which lands in the workload spec: use valueFrom.secretKeyRef, pointing at a Secret Terraform owns"

  - it: refuses a plain GOOGLE_CLIENT_SECRET
    set:
      backend.env:
        - name: GOOGLE_CLIENT_SECRET
          value: a-google-secret
    asserts:
      - failedTemplate:
          errorMessage: "backend.env sets GOOGLE_CLIENT_SECRET as a plain value, which lands in the workload spec: use valueFrom.secretKeyRef, pointing at a Secret Terraform owns"

  - it: accepts the same secret as a secretKeyRef
    set:
      redis.auth.existingSecret: mailflow-redis
      backend.env:
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: mailflow-session
              key: secret
    asserts:
      - isKind:
          of: Deployment

  # 4.4.0 keeps sessions in Postgres, so no Redis anywhere is the default and has to render.
  - it: renders with no Redis at all
    asserts:
      - isKind:
          of: Deployment

  - it: accepts an external Redis named instead
    set:
      backend.redisUrl: redis://redis.redis.svc.cluster.local:6379
    asserts:
      - isKind:
          of: Deployment

  # A tag pinned back before 4.4.0 is the one release that will not start without a Redis.
  - it: fails on a pre-4.4.0 tag with no Redis and no REDIS_URL
    set:
      image.tag: "4.3.1"
      frontend.securityContext.readOnlyRootFilesystem: false
    asserts:
      - failedTemplate:
          errorMessage: "image.tag 4.3.1 is a release before 4.4.0, which keeps sessions in Redis and will not start without one: set redis.enabled=true (with redis.auth.existingSecret) or backend.redisUrl. 4.4.0 and later keep sessions in Postgres and need neither"

  - it: accepts a pre-4.4.0 tag with the bundled Redis turned on
    set:
      image.tag: "4.3.1"
      redis.enabled: true
      redis.auth.existingSecret: mailflow-redis
      frontend.securityContext.readOnlyRootFilesystem: false
    asserts:
      - isKind:
          of: Deployment

  # A tag that is not a plain x.y.z says nothing about which release it is, so neither
  # pre-4.4.0 guardrail fires on it.
  - it: leaves a tag it cannot read alone
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment

  # Shipping a Redis that asks for nothing has to be a decision, not a default.
  - it: fails on a bundled Redis with no password secret
    set:
      redis.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "redis.auth.existingSecret is required: Redis holds MailFlow's sessions, a session is mailbox access, and nothing in front of port 6379 asks for a credential. Point it at a Secret carrying the password, or set redis.auth.enabled=false to accept an open Redis"

  - it: accepts an open Redis only when asked for explicitly
    set:
      redis.enabled: true
      redis.auth.enabled: false
    asserts:
      - isKind:
          of: Deployment

  - it: needs no password secret for an external Redis
    set:
      backend.redisUrl: redis://redis.redis.svc.cluster.local:6379
    asserts:
      - isKind:
          of: Deployment

  # The nginx frontend rewrites /etc/nginx/conf.d/default.conf at boot three times over; each
  # rewrite fails soft, so a read-only filesystem serves HTTPS with no certificate and /api/
  # pointed at nothing instead of crashing.
  - it: fails on a pre-4.4.0 tag with a read-only root filesystem
    set:
      image.tag: "4.3.1"
      redis.enabled: true
      redis.auth.existingSecret: mailflow-redis
    asserts:
      - failedTemplate:
          errorMessage: "image.tag 4.3.1 serves the app from nginx, whose entrypoint rewrites /etc/nginx/conf.d/default.conf at boot: set frontend.securityContext.readOnlyRootFilesystem=false, or the pod comes up with HTTPS on, no certificate and /api/ pointed at nothing"

  # Unset, TLS_MODE is self-signed to the image: it would serve a certificate of its own making
  # behind an ingress that already terminates TLS, and HSTS makes that unrecoverable.
  - it: refuses an empty tlsMode
    set:
      frontend.tlsMode: ""
    asserts:
      - failedTemplate:
          errorMessage: "frontend.tlsMode is \"\": it has to be self-signed, letsencrypt or off, and it is never empty, because the Caddy frontend reads an unset TLS_MODE as self-signed and serves HTTPS with a certificate it made up"

  - it: refuses a tlsMode the image does not know
    set:
      frontend.tlsMode: "on"
    asserts:
      - failedTemplate:
          errorMessage: "frontend.tlsMode is \"on\": it has to be self-signed, letsencrypt or off, and it is never empty, because the Caddy frontend reads an unset TLS_MODE as self-signed and serves HTTPS with a certificate it made up"

  # self-signed writes a certificate and letsencrypt writes the ACME account; TLS_MODE=off is
  # the one mode that writes nothing.
  - it: refuses a read-only root filesystem with TLS on
    set:
      frontend.tlsMode: self-signed
    asserts:
      - failedTemplate:
          errorMessage: "frontend.tlsMode=self-signed needs a writable filesystem - self-signed writes a certificate, letsencrypt writes the ACME account and certificate - so set frontend.securityContext.readOnlyRootFilesystem=false, or mount writable volumes at /etc/mailflow/certs and /data"

  - it: accepts TLS on with a writable filesystem
    set:
      frontend.tlsMode: letsencrypt
      frontend.securityContext.readOnlyRootFilesystem: false
    asserts:
      - isKind:
          of: Deployment

  # Unresolved, the literal string "$(REDIS_PASSWORD)" becomes the password Redis is sent.
  - it: fails on a redisUrl referencing a password nothing defines
    set:
      redis.enabled: false
      backend.redisUrl: redis://:$(REDIS_PASSWORD)@redis.other.svc.cluster.local:6379
    asserts:
      - failedTemplate:
          errorMessage: "backend.redisUrl references $(REDIS_PASSWORD) but nothing defines it: set redis.auth.existingSecret (and keep redis.auth.enabled), or the literal string reaches Redis as the password"

  - it: fails the same way when auth is turned off under it
    set:
      redis.enabled: false
      redis.auth.enabled: false
      redis.auth.existingSecret: mailflow-redis
      backend.redisUrl: redis://:$(REDIS_PASSWORD)@redis.other.svc.cluster.local:6379
    asserts:
      - failedTemplate:
          errorMessage: "backend.redisUrl references $(REDIS_PASSWORD) but nothing defines it: set redis.auth.existingSecret (and keep redis.auth.enabled), or the literal string reaches Redis as the password"

  # backend.env is appended after REDIS_URL, so an entry here would never expand anyway.
  - it: refuses REDIS_PASSWORD in the raw backend env list
    set:
      redis.auth.existingSecret: mailflow-redis
      backend.env:
        - name: REDIS_PASSWORD
          value: hunter2
    asserts:
      - failedTemplate:
          errorMessage: "backend.env sets REDIS_PASSWORD, which this chart derives: use redis.auth.existingSecret, which the chart renders ahead of REDIS_URL so $(REDIS_PASSWORD) resolves inside backend.redisUrl as well - an entry here would land after it and never expand"

  - it: fails on an empty imageCache.path
    set:
      redis.auth.existingSecret: mailflow-redis
      imageCache.path: ""
    asserts:
      - failedTemplate:
          errorMessage: "imageCache.path is required: it is both IMAGE_CACHE_DIR and the emptyDir mount path"
