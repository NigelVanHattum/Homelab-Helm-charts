suite: frontend workload
release:
  name: mailflow
  namespace: mailflow
templates:
  - templates/frontend.yaml
tests:
  - it: pins the frontend image to the same tag as the backend
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/maathimself/mailflow-frontend:[0-9]+\.[0-9]+\.[0-9]+$'

  - it: moves with image.tag, so one value bumps both images
    set:
      image.tag: "4.5.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/maathimself/mailflow-frontend:4.5.0

  # 4.4's Caddy frontend reads TLS_MODE and still honours NGINX_TLS; a 4.3.x image.tag reads
  # only NGINX_TLS. Both set keeps pinning back a tag change.
  - it: turns TLS off through both variables
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGINX_TLS
            value: "off"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_MODE
            value: "off"

  - it: points the API upstream at this release's backend Service, never the compose default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKEND_HOST
            value: mailflow-backend
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKEND_PORT
            value: "3000"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKEND_HOST
            value: backend

  - it: follows a renamed release and a moved backend port
    release:
      name: webmail
    set:
      backend.service.port: 3100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKEND_HOST
            value: webmail-mailflow-backend
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKEND_PORT
            value: "3100"

  - it: takes an explicit backendHost
    set:
      frontend.backendHost: mailflow-api.other.svc.cluster.local
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKEND_HOST
            value: mailflow-api.other.svc.cluster.local

  # The Caddyfile sets `admin off` and `persist_config off`, and TLS_MODE=off writes no
  # certificate, so nothing writes to the filesystem at all (upstream #453).
  - it: runs on a read-only root filesystem
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  # Caddy listens on port 80, and drop: [ALL] takes NET_BIND_SERVICE away from root too.
  # SETUID/SETGID went with nginx, which forked its workers as another user.
  - it: keeps only the capability Caddy needs to bind port 80
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          value:
            - NET_BIND_SERVICE

  # The image's own /healthz binds 127.0.0.1:2080, and 4.3.x has no such location.
  - it: probes GET / on port 80
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 80
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: appends frontend.env verbatim
    set:
      frontend.env:
        - name: SOMETHING_ELSE
          value: "1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SOMETHING_ELSE
            value: "1"

  - it: drops NGINX_TLS when emptied on purpose, and keeps TLS_MODE
    set:
      frontend.nginxTls: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NGINX_TLS
            value: "off"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_MODE
            value: "off"

  # An unset TLS_MODE is self-signed to the image, so the variable is never conditional: it
  # renders even with every other frontend value cleared.
  - it: renders TLS_MODE whatever else is set
    set:
      frontend.nginxTls: ""
      frontend.env: []
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_MODE
            value: "off"
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: TLS_MODE
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 3
