suite: rendering behaviour
release:
  name: prowlarr
  namespace: media
tests:
  - it: renders a StatefulSet named after the release
    templates:
      - templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: prowlarr
      - equal:
          path: metadata.namespace
          value: media
      - equal:
          path: spec.replicas
          value: 1

  - it: pulls the linuxserver image and defaults the tag to latest
    templates:
      - templates/statefulset.yaml
    set:
      image.tag: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: lscr.io/linuxserver/prowlarr:latest

  - it: honours an explicit image tag
    templates:
      - templates/statefulset.yaml
    set:
      image.tag: "1.2.3"
      image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: lscr.io/linuxserver/prowlarr:1.2.3
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: passes prowlarr.env through verbatim
    templates:
      - templates/statefulset.yaml
    set:
      prowlarr.env:
        - name: PUID
          value: "1036"
        - name: POSTGRES_HOST
          value: pg.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_HOST
            value: pg.example.com

  - it: mounts the config volume at /config
    templates:
      - templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: "/config"
            name: prowlarr-config

  - it: claims the chart-managed config PVC by default
    templates:
      - templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: prowlarr-config
            persistentVolumeClaim:
              claimName: prowlarr-config

  - it: points the config volume at an existing PVC when given one
    templates:
      - templates/statefulset.yaml
    set:
      prowlarr.persistence.config.useExistingPvc: pv-prowlarr-config
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: prowlarr-config
            persistentVolumeClaim:
              claimName: pv-prowlarr-config

  - it: sizes the config claim template from values
    templates:
      - templates/statefulset.yaml
    set:
      prowlarr.persistence.config.size: 5Gi
      prowlarr.persistence.config.storageClassName: nfs-csi-applications
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: prowlarr-config
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 5Gi
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: nfs-csi-applications

  - it: binds the claim to a named volume when asked
    templates:
      - templates/statefulset.yaml
    set:
      prowlarr.persistence.config.existingVolume: pv-prowlarr
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.volumeName
          value: pv-prowlarr

  # The template emits the volumeClaimTemplates key unconditionally, so with
  # persistence off the StatefulSet carries `volumeClaimTemplates: null`.
  # Kubernetes accepts it; the assertion pins the behaviour so a later cleanup
  # is a deliberate change rather than a surprise.
  - it: falls back to emptyDir when config persistence is off
    templates:
      - templates/statefulset.yaml
    set:
      prowlarr.persistence.config.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: prowlarr-config
            emptyDir: {}
      - isNullOrEmpty:
          path: spec.volumeClaimTemplates

  - it: leaves the pod template free of the nondeterministic rollme annotation
    templates:
      - templates/statefulset.yaml
    asserts:
      - isNull:
          path: spec.template.metadata.annotations

  # rollme is randAlphaNum, so it changes on every render. With podAnnotations
  # set, a GitOps controller that re-renders the chart sees a fresh value every
  # refresh and reports the workload permanently OutOfSync.
  - it: stamps a random rollme once podAnnotations are set
    templates:
      - templates/statefulset.yaml
    set:
      podAnnotations:
        example.com/owner: homelab
    asserts:
      - exists:
          path: spec.template.metadata.annotations.rollme
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: homelab
